<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Mis Datos - CLUB ACERIAS</title>
    <style>
        :root {
            --morado-oscuro: #3b1868;
            --morado-principal: #6d28d9;
            --morado-medio: #8b5cf6;
            --morado-suave: #f3e8ff;
            --morado-borde: #e9d5ff;
            --fondo-app: #f7f5fc;
            --texto-principal: #1e1b2e;
            --texto-suave: #645d7a;
        }

        body {
            background: radial-gradient(circle at top right, #ede9fe 0%, var(--fondo-app) 45%, #f3f0fa 100%);
            min-height: 100vh;
            color: var(--texto-principal);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .topbar-morado {
            background: linear-gradient(120deg, var(--morado-oscuro) 0%, var(--morado-principal) 60%, var(--morado-medio) 100%);
            color: #ffffff;
            padding: 18px 28px;
            box-shadow: 0 8px 24px rgba(76, 29, 149, 0.18);
        }

        .btn-volver-morado {
            background-color: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-volver-morado:hover {
            background-color: #ffffff;
            color: var(--morado-oscuro);
            border-color: #ffffff;
        }

        .card-estetica {
            background: #ffffff;
            border: 1px solid var(--morado-borde);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(88, 28, 135, 0.06);
            overflow: hidden;
        }

        .card-header-morado {
            background: linear-gradient(90deg, var(--morado-oscuro), var(--morado-principal));
            color: #ffffff;
            padding: 16px 22px;
            border: none;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--morado-oscuro);
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            border-radius: 11px;
            border: 1px solid #d8cbf0;
            padding: 10px 14px;
            background-color: #fdfcff;
            color: var(--texto-principal);
            transition: all 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--morado-principal);
            background-color: #ffffff;
            box-shadow: 0 0 0 0.22rem rgba(109, 40, 217, 0.16);
        }

        .form-control[readonly] {
            background-color: #f3effa;
            color: var(--texto-suave);
        }

        .btn-morado {
            background: linear-gradient(135deg, var(--morado-principal), var(--morado-medio));
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 11px 18px;
            border-radius: 11px;
            box-shadow: 0 6px 16px rgba(109, 40, 217, 0.24);
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-morado:hover {
            color: #ffffff;
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(109, 40, 217, 0.32);
        }
    </style>
</head>

<body>
    <header class="topbar-morado d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-vcard fs-4"></i>
            <h4 class="mb-0 fw-bold">Mis Datos</h4>
        </div>
        <a href="dashboard.html" class="btn btn-volver-morado btn-sm text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Volver al Panel
        </a>
    </header>

    <main class="container py-4" style="max-width: 920px;">
        <div class="card card-estetica">
            <div class="card-header-morado d-flex align-items-center gap-2">
                <i class="bi bi-sliders2 fs-5"></i>
                <h5 class="mb-0 fw-semibold">Información personal del asociado</h5>
            </div>

            <div class="card-body p-4">
                <form id="formMisDatos">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="documento" class="form-label">Documento</label>
                            <input type="text" class="form-control" id="documento" name="documento" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="genero" class="form-label">Género</label>
                            <select class="form-select" id="genero" name="genero">
                                <option value="">Seleccione...</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="nombres" class="form-label">Nombres</label>
                            <input type="text" class="form-control" id="nombres" name="nombres" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="apellidos" name="apellidos" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento">
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" name="telefono">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="ciudad" class="form-label">Ciudad</label>
                            <input type="text" class="form-control" id="ciudad" name="ciudad">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="direccionResidencia" class="form-label">Dirección de Residencia</label>
                        <input type="text" class="form-control" id="direccionResidencia" name="direccionResidencia">
                    </div>

                    <div id="mensajeMisDatos" class="mb-3 fw-bold"></div>

                    <button type="submit" class="btn btn-morado w-100">
                        <i class="bi bi-floppy me-1"></i> Guardar Cambios
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="../Controladores/misDatos.js"></script>
</body>

</html>
