<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Mis Pagos - CLUB ACERIAS</title>
    <style>
        :root {
            --morado-oscuro: #3b1868;
            --morado-principal: #6d28d9;
            --morado-medio: #8b5cf6;
            --morado-suave: #f3e8ff;
            --morado-borde: #e9d5ff;
            --fondo-app: #f7f5fc;
            --texto-principal: #1e1b2e;
            --texto-suave: #645d7a;
        }

        body {
            background: radial-gradient(circle at top right, #ede9fe 0%, var(--fondo-app) 45%, #f3f0fa 100%);
            min-height: 100vh;
            color: var(--texto-principal);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .topbar-morado {
            background: linear-gradient(120deg, var(--morado-oscuro) 0%, var(--morado-principal) 60%, var(--morado-medio) 100%);
            color: #ffffff;
            padding: 18px 28px;
            box-shadow: 0 8px 24px rgba(76, 29, 149, 0.18);
        }

        .btn-volver-morado {
            background-color: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-volver-morado:hover {
            background-color: #ffffff;
            color: var(--morado-oscuro);
            border-color: #ffffff;
        }

        .card-estetica {
            background: #ffffff;
            border: 1px solid var(--morado-borde);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(88, 28, 135, 0.06);
            overflow: hidden;
        }

        .card-header-morado {
            background: linear-gradient(90deg, var(--morado-oscuro), var(--morado-principal));
            color: #ffffff;
            padding: 16px 22px;
            border: none;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--morado-oscuro);
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            border-radius: 11px;
            border: 1px solid #d8cbf0;
            padding: 10px 14px;
            background-color: #fdfcff;
            color: var(--texto-principal);
            transition: all 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--morado-principal);
            background-color: #ffffff;
            box-shadow: 0 0 0 0.22rem rgba(109, 40, 217, 0.16);
        }

        .btn-morado {
            background: linear-gradient(135deg, var(--morado-principal), var(--morado-medio));
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 11px 18px;
            border-radius: 11px;
            box-shadow: 0 6px 16px rgba(109, 40, 217, 0.24);
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-morado:hover {
            color: #ffffff;
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(109, 40, 217, 0.32);
        }

        .badge-total-morado {
            background-color: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .tabla-morada thead th {
            background-color: var(--morado-suave);
            color: var(--morado-oscuro);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
            border-bottom: 2px solid var(--morado-borde);
            padding: 13px 16px;
            white-space: nowrap;
        }

        .tabla-morada tbody td {
            padding: 13px 16px;
            vertical-align: middle;
            border-color: #f1eafa;
            white-space: nowrap;
        }

        .tabla-morada tbody tr:hover {
            background-color: #faf5ff;
        }
    </style>
</head>

<body>
    <header class="topbar-morado d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-wallet2 fs-4"></i>
            <h4 class="mb-0 fw-bold">Mis Pagos</h4>
        </div>
        <a href="dashboard.html" class="btn btn-volver-morado btn-sm text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Volver al panel
        </a>
    </header>

    <main class="container py-4" style="max-width: 920px;">
        <div class="card card-estetica mb-4">
            <div class="card-header-morado d-flex align-items-center gap-2">
                <i class="bi bi-plus-circle fs-5"></i>
                <h5 class="mb-0 fw-semibold">Registrar cuota pagada</h5>
            </div>
            <div class="card-body p-4">
                <form id="formPago">
                    <div class="mb-3">
                        <label for="prestamo" class="form-label">Préstamo</label>
                        <select id="prestamo" class="form-select" required>
                            <option value="">Seleccione un préstamo</option>
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="valorCuota" class="form-label">Valor pagado</label>
                            <input type="number" id="valorCuota" class="form-control" min="1" step="any" placeholder="Ej. 200000" required>
                        </div>

                        <div class="col-md-6">
                            <label for="fechaPago" class="form-label">Fecha del pago</label>
                            <input type="date" id="fechaPago" class="form-control" required>
                        </div>
                    </div>

                    <div id="mensajePago" class="small fw-bold mb-3"></div>

                    <button type="submit" class="btn btn-morado w-100">
                        <i class="bi bi-check2-circle me-1"></i> Guardar pago
                    </button>
                </form>
            </div>
        </div>

        <div class="card card-estetica">
            <div class="card-header-morado d-flex justify-content-between align-items-center gap-2 flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-clock-history fs-5"></i>
                    <h5 class="mb-0 fw-semibold">Historial de pagos</h5>
                </div>
                <span id="totalPagado" class="badge-total-morado">Total: $ 0</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table tabla-morada mb-0">
                        <thead>
                            <tr>
                                <th>Pago</th>
                                <th>Préstamo</th>
                                <th>Valor</th>
                                <th>Fecha</th>
                            </tr>
                        </thead>
                        <tbody id="listaPagos">
                            <tr>
                                <td colspan="4" class="text-center py-4 text-muted">Cargando historial...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="../Controladores/misPagos.js"></script>
</body>

</html>
