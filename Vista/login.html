<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Iniciar Sesión - CLUB ACERIAS</title>
    <style>
        :root {
            --morado-oscuro: #3b1868;
            --morado-principal: #6d28d9;
            --morado-medio: #8b5cf6;
            --morado-suave: #f3e8ff;
            --morado-borde: #e9d5ff;
            --fondo-app: #f7f5fc;
            --texto-principal: #1e1b2e;
            --texto-suave: #645d7a;
        }

        body {
            background: radial-gradient(circle at top right, #ede9fe 0%, var(--fondo-app) 45%, #f3f0fa 100%);
            min-height: 100vh;
            color: var(--texto-principal);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 14px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .card-login {
            background: #ffffff;
            border: 1px solid var(--morado-borde);
            border-radius: 20px;
            box-shadow: 0 14px 36px rgba(76, 29, 149, 0.12);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(120deg, var(--morado-oscuro) 0%, var(--morado-principal) 60%, var(--morado-medio) 100%);
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
        }

        .login-logo {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background-color: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.65rem;
            margin-bottom: 12px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--morado-oscuro);
            margin-bottom: 6px;
        }

        .input-group-text-morado {
            background-color: #faf5ff;
            border: 1px solid #d8cbf0;
            border-right: none;
            border-radius: 11px 0 0 11px;
            color: var(--morado-principal);
        }

        .form-control-morado {
            border-radius: 11px;
            border: 1px solid #d8cbf0;
            padding: 10px 14px;
            background-color: #fdfcff;
            color: var(--texto-principal);
            transition: all 0.2s ease;
        }

        .input-group .form-control-morado {
            border-left: none;
            border-radius: 0 11px 11px 0;
        }

        .input-group .form-control-morado.con-boton {
            border-right: none;
            border-radius: 0;
        }

        .btn-ver-clave {
            border: 1px solid #d8cbf0;
            border-left: none;
            border-radius: 0 11px 11px 0;
            background-color: #fdfcff;
            color: var(--texto-suave);
        }

        .btn-ver-clave:hover {
            background-color: var(--morado-suave);
            color: var(--morado-oscuro);
        }

        .form-control-morado:focus {
            border-color: var(--morado-principal);
            background-color: #ffffff;
            box-shadow: 0 0 0 0.22rem rgba(109, 40, 217, 0.16);
        }

        .btn-morado {
            background: linear-gradient(135deg, var(--morado-principal), var(--morado-medio));
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 11px 18px;
            border-radius: 11px;
            box-shadow: 0 6px 16px rgba(109, 40, 217, 0.24);
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-morado:hover {
            color: #ffffff;
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(109, 40, 217, 0.32);
        }

        .enlace-morado {
            color: var(--morado-principal);
            font-weight: 600;
            text-decoration: none;
        }

        .enlace-morado:hover {
            color: var(--morado-oscuro);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="card card-login">
            <div class="login-header">
                <div class="login-logo">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h4 class="mb-1 fw-bold">CLUB ACERIAS</h4>
                <p class="mb-0 small opacity-75">Inicia sesión para acceder a tu cuenta</p>
            </div>

            <div class="card-body p-4">
                <form id="formLogin">
                    <div class="mb-3">
                        <label for="documento" class="form-label">Documento de identidad</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-morado">
                                <i class="bi bi-person-vcard"></i>
                            </span>
                            <input type="text" id="documento" name="documento" class="form-control form-control-morado" placeholder="Ingresa tu documento" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="clave" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-morado">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="password" id="clave" name="clave" class="form-control form-control-morado con-boton" placeholder="Ingresa tu contraseña" required>
                            <button type="button" id="toggleClave" class="btn btn-ver-clave" aria-label="Mostrar o ocultar contraseña">
                                <i class="bi bi-eye" id="iconoClave"></i>
                            </button>
                        </div>
                    </div>

                    <div id="mensajeLogin" class="small fw-bold mb-3"></div>

                    <button type="submit" class="btn btn-morado w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                    </button>
                </form>

                <hr class="my-4" style="border-color: var(--morado-borde);">

                <div class="text-center small text-secondary">
                    ¿Aún no tienes cuenta?
                    <a href="Registro.html" class="enlace-morado">Regístrate aquí</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../Controladores/login.js"></script>
    <script>
        const btnToggleClave = document.getElementById("toggleClave");
        const inputClave = document.getElementById("clave");
        const iconoClave = document.getElementById("iconoClave");

        btnToggleClave?.addEventListener("click", () => {
            const esPassword = inputClave.type === "password";
            inputClave.type = esPassword ? "text" : "password";
            iconoClave.className = esPassword ? "bi bi-eye-slash" : "bi bi-eye";
        });
    </script>
</body>

</html>
