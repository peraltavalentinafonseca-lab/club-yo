<html lang = "es"> 
    <head>
        <meta charset= "UTF-8">
        <title> Proyecto ADSO </title>
    <link rel="stylesheet" href="../Assets/css/estilos.css">
    </head>

    <body>
        <div>
            <h2> Registro de Asociado - Acerias </h2>
            <form id="FormularioRegistro" action="../Modelos/guardarAsociado.php" method="post" accept-charset="UTF-8" onsubmit="return validarFormulario(event)">
                <div class="grupo-input">
                    <label> Ingresar Documento: </label>
                    <input id="Documento" type="text" name="documento" inputmode="numeric" required placeholder="Ejemplo: 1053555550">
                </div>
                <div class="grupo-input">
                    <label> Ingresar Nombre: </label>
                    <input id="Nombre" type="text" name="nombres" required placeholder="Ingrese su nombre completo">
                </div>
                <div class="grupo-input">
                    <label> Ingresar Apellidos: </label>
                      <input id="Apellidos" type="text" name="apellidos" required placeholder="Ingrese sus apellidos completos">
                </div>
                <div class="grupo-input">
                    <label>Ingresar Fecha de Nacimiento</label>
                    <input id="fechaNacimiento" name="fechaNacimiento" type="date" required placeholder="Ingrese Fecha de Nacimiento">
                </div>
                <div class="grupo-input">
                    <label> dirección de Residencia: </label>
                    <input id="direccionResidencia" type="text" name="direccionResidencia" required placeholder="Ejemplo: Calle 24">
                </div>
                <div class="grupo-input">
                    <label> Ciudad: </label>
                    <select id="ciudad" name="ciudad" required>
                        <option value="Sogamoso">Sogamoso </option>
                          <option value="Duitama">Duitama </option> 
                            <option value="Tunja">Tunja </option>                     

                    </select>
                </div>
                <div class="grupo-input">
                    <label> Telefono:  </label>
                    <input id= "telefono" type="tel" name="telefono" required placeholder="Ejemplo: 3225828590">
                </div>
                 <div class="grupo-input">
                    <label> Ingrese su email: </label>
                    <input id= "email" type="email" name="email" required placeholder="Ejemplo: pepita@gmail.com">
                </div>
                <div class="grupo-input">
                    <label>Crea un contraseña:</label>
                    <input 
                    type="password"
                    id="contraseña" 
                    name="contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                    placeholder="Minimo 8 caracteres"
                    >
                </div>
                <div class="grupo-input">
                    <label>Confirme su contraseña:</label>
                    <input 
                    type="password"
                    id="confirmarContraseña" 
                    name="confirmarContraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                    placeholder="Escribe la nueva contraseña"
                    >
                </div>
              
        
              <div class="grupo-input">
                    <label>Seleccione su Genero</label>
                    <label>
                        <input type="radio" id="Femenino" name="genero" value="Femenino" required>
                        <span>Femenino</span>
                    </label>
                    <label>
                        <input type="radio" id="Masculino" name="genero" value="Masculino" required>
                        <span>Masculino</span>
                    </label>
                    <label>
                        <input type="radio" id="Otro" name="genero" value="Otro" required>
                        <span>Otro</span>
                    </label>
                </div>

                <div>
                    <button type="submit"> Guardar </button>
                </div>
                <p id="MensajeRegistro" role="status" aria-live="polite"></p>
            </form>
        </div>
    </body>
    <script>
        function validarFormulario(event) {
            const form = document.getElementById('FormularioRegistro');
            const password = document.getElementById('contraseña');
            const confirmarPassword = document.getElementById('confirmarContraseña');
            const email = document.getElementById('email');
            const mensaje = document.getElementById('MensajeRegistro');

            mensaje.textContent = '';

            if (!form.checkValidity()) {
                form.reportValidity();
                return false;
            }

            if (password.value.length < 8) {
                mensaje.textContent = 'La contraseña debe tener mínimo 8 caracteres.';
                password.focus();
                return false;
            }

            if (password.value !== confirmarPassword.value) {
                mensaje.textContent = 'Las contraseñas no coinciden.';
                confirmarPassword.focus();
                return false;
            }

            if (!email.validity.valid) {
                mensaje.textContent = 'Ingrese un correo electrónico válido.';
                email.focus();
                return false;
            }

            return true;
        }
    </script>
    <script src="../Controladores/asociado.js"> </script>

</html>
