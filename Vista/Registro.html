<html lang="es"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto ADSO - Registro</title>
        <link rel="stylesheet" href="../Assets/css/estilos.css">
    </head>

    <body>
        <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 480px; width: 100%;">
            <h2>Registro de Asociado - Acerias</h2>
            <form id="formRegistro" action="../Modelos/guardarAsociado.php" method="POST"> 
                <div class="grupo-input">
                    <label for="Documento">Documento:</label>
                    <input id="Documento" type="number" name="documento" required placeholder="Ejemplo: 1053555550">
                </div>
                <div class="grupo-input">
                    <label> Ingresar Documento: </label>
                    <input id="Documento" type="number" name="Documento" required placeholder="Ejemplo: 1053555550">
                </div>
                <div class="grupo-input">
                    <label> Ingresar Nombre: </label>
                    <input id="Nombre" type="text" name="Nombre" required placeholder="Ingrese su nombre completo">
                </div>
                <div class="grupo-input">
                    <label> Ingresar Apellidos: </label>
                      <input id="Apellidos" type="text" name="Apellidos" required placeholder="Ingrese sus apellidos completos">
                </div>
                <div class="grupo-input">
                    <label> Dirección de Residencia: </label>
                    <input id="DirecciónResidencia" type="text" name="DirecciónResidencia" required placeholder="Ejemplo: Calle 24">
                </div>
                <div class="grupo-input">
                    <label> Ciudad: </label>
                    <select id="Ciudad" name="Ciudad" required>
                        <option value="Sogamoso">Sogamoso </option>
                          <option value="Duitama">Duitama </option> 
                            <option value="Tunja">Tunja </option>                     

                    </select>
                </div>
                <div class="grupo-input">
                    <label> Telefono:  </label>
                    <input id= "Telefono" type="tel" name="Telefono" required placeholder="Ejemplo: 3225828590">
                </div>
                 <div class="grupo-input">
                    <label> Ingrese su email: </label>
                    <input id= "Email" type="text" name="Email" required placeholder="Ejemplo: pepita@gmail.com">
                </div>
               <div class="grupo-input">
                    <label>Ingresar Genero:</label>
                    <input type="radio" id="Femenino" name= "Genero" value="Femenino" required> 
                    <label>Femenino</label>
                    <input type="radio" id="Masculino" name="Genero" values="Masculino" required> 
                    <label>Masculino</label>
                    <input type="radio" id="Otro" name="Genero" values="Otro" required> 
                    <label>Otro</label>
                </div>
                <div>
                    <button type="submit"> Guardar </button>
                </div>
                <p id = "Mensaje Registro" role="status" aria-live="polite"></p>
            </form>
        </div>
        <script src="../Controladores/asociado.js"></script>
    </body>
    <script>
        function validarFormulario(event) {
            const form = document.getElementById('FormularioRegistro');
            const password = document.getElementById('contraseña');
            const confirmarPassword = document.getElementById('confirmarContraseña');
            const email = document.getElementById('email');
            const mensaje = document.getElementById('MensajeRegistro');

            mensaje.textContent = '';

            if (!form.checkValidity()) {
                form.reportValidity();
                return false;
            }

            if (password.value.length < 8) {
                mensaje.textContent = 'La contraseña debe tener mínimo 8 caracteres.';
                password.focus();
                return false;
            }

            if (password.value !== confirmarPassword.value) {
                mensaje.textContent = 'Las contraseñas no coinciden.';
                confirmarPassword.focus();
                return false;
            }

            if (!email.validity.valid) {
                mensaje.textContent = 'Ingrese un correo electrónico válido.';
                email.focus();
                return false;
            }

            return true;
        }
    </script>
    <script src="../Controladores/asociado.js"> </script>

</html>
