<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Actividades - CLUB ACERIAS</title>
    <style>
        :root {
            --morado-oscuro: #3b1868;
            --morado-principal: #6d28d9;
            --morado-medio: #8b5cf6;
            --morado-suave: #f3e8ff;
            --morado-borde: #e9d5ff;
            --fondo-app: #f7f5fc;
            --texto-principal: #1e1b2e;
            --texto-suave: #645d7a;
        }

        body {
            background: radial-gradient(circle at top right, #ede9fe 0%, var(--fondo-app) 45%, #f3f0fa 100%);
            min-height: 100vh;
            color: var(--texto-principal);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .topbar-morado {
            background: linear-gradient(120deg, var(--morado-oscuro) 0%, var(--morado-principal) 60%, var(--morado-medio) 100%);
            color: #ffffff;
            padding: 18px 28px;
            box-shadow: 0 8px 24px rgba(76, 29, 149, 0.18);
        }

        .btn-volver-morado {
            background-color: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-volver-morado:hover {
            background-color: #ffffff;
            color: var(--morado-oscuro);
            border-color: #ffffff;
        }

        .card-estetica {
            background: #ffffff;
            border: 1px solid var(--morado-borde);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(88, 28, 135, 0.06);
            overflow: hidden;
        }

        .card-header-morado {
            background: linear-gradient(90deg, var(--morado-oscuro), var(--morado-principal));
            color: #ffffff;
            padding: 16px 22px;
            border: none;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--morado-oscuro);
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            border-radius: 11px;
            border: 1px solid #d8cbf0;
            padding: 10px 14px;
            background-color: #fdfcff;
            color: var(--texto-principal);
            transition: all 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--morado-principal);
            background-color: #ffffff;
            box-shadow: 0 0 0 0.22rem rgba(109, 40, 217, 0.16);
        }

        .btn-morado {
            background: linear-gradient(135deg, var(--morado-principal), var(--morado-medio));
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 11px;
            box-shadow: 0 6px 16px rgba(109, 40, 217, 0.24);
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-morado:hover {
            color: #ffffff;
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(109, 40, 217, 0.32);
        }

        .tabla-morada thead th {
            background-color: var(--morado-suave);
            color: var(--morado-oscuro);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
            border-bottom: 2px solid var(--morado-borde);
            padding: 13px 16px;
            white-space: nowrap;
        }

        .tabla-morada tbody td {
            padding: 13px 16px;
            vertical-align: middle;
            border-color: #f1eafa;
            white-space: nowrap;
        }

        .tabla-morada tbody tr:hover {
            background-color: #faf5ff;
        }

        .modal-content {
            border: 1px solid var(--morado-borde);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(59, 24, 104, 0.2);
        }
    </style>
</head>

<body>
    <header class="topbar-morado d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-calendar-event fs-4"></i>
            <h4 class="mb-0 fw-bold">Actividades</h4>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button type="button" id="nuevaActividad" class="btn btn-light btn-sm fw-semibold rounded-3 d-none" style="color: var(--morado-oscuro);">
                <i class="bi bi-plus-lg me-1"></i> Nueva Actividad
            </button>
            <a href="dashboard.html" class="btn btn-volver-morado btn-sm text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Volver al panel
            </a>
        </div>
    </header>

    <main class="container py-4" style="max-width: 1020px;">
        <div class="card card-estetica">
            <div class="card-header-morado d-flex align-items-center gap-2">
                <i class="bi bi-table fs-5"></i>
                <h5 class="mb-0 fw-semibold">Programación de actividades</h5>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table tabla-morada mb-0">
                        <thead>
                            <tr>
                                <th>Actividad</th>
                                <th>Fecha</th>
                                <th>Municipio</th>
                                <th>Total Recaudado</th>
                                <th id="encabezadoAcciones" class="d-none">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaActividades">
                            <tr>
                                <td colspan="4" class="text-center py-4 text-muted">Cargando actividades...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Crear / Editar Actividad -->
    <div class="modal fade" id="modalActividad" tabindex="-1" aria-labelledby="tituloModalActividad" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="card-header-morado d-flex justify-content-between align-items-center">
                    <h5 class="modal-title mb-0 fw-semibold" id="tituloModalActividad">Nueva Actividad</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form id="formActividad">
                    <div class="modal-body p-4">
                        <input type="hidden" id="idActividad">

                        <div class="mb-3">
                            <label for="nombreActividad" class="form-label">Nombre de la actividad</label>
                            <input type="text" id="nombreActividad" class="form-control" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="fechaEvento" class="form-label">Fecha del evento</label>
                                <input type="date" id="fechaEvento" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="municipio" class="form-label">Municipio</label>
                                <input type="text" id="municipio" class="form-control" required>
                            </div>
                        </div>

                        <div id="campoTotalRecaudado" class="mb-2 d-none">
                            <label for="totalRecaudado" class="form-label">Total recaudado</label>
                            <input type="number" id="totalRecaudado" class="form-control" min="0" step="any" placeholder="Opcional">
                        </div>
                    </div>

                    <div class="modal-footer border-0 pt-0 px-4 pb-4">
                        <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="guardarActividad" class="btn btn-morado">Guardar Actividad</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/actividades.js"></script>
</body>

</html>
