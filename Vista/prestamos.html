<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Gestión de Préstamos - CLUB ACERIAS</title>
    <style>
        .header-mr {
            background-color: rgb(151, 83, 196);
            color: white;
            padding: 18px 30px;
        }
    </style>
</head>

<body class="bg-light">
    <div class="header-mr d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Gestión de Préstamos</h4>
        <a href="dashboard.html" class="btn btn-dark btn-sm">
            <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
    </div>

    <div class="container py-4">
        <div id="mensajePrestamo"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Registrar / Editar préstamo</h5>
                <form id="formPrestamo" class="row g-3">
                    <input type="hidden" id="idPrestamo">

                    <div class="col-md-4">
                        <label for="idAsociado" class="form-label">Asociado</label>
                        <select id="idAsociado" class="form-select" required>
                            <option value="">Seleccione un asociado</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="valorPrestamo" class="form-label">Valor del préstamo</label>
                        <input type="number" id="valorPrestamo" class="form-control" min="1" step="0.01" required>
                    </div>

                    <div class="col-md-2">
                        <label for="tasaInteres" class="form-label">Tasa (%)</label>
                        <input type="number" id="tasaInteres" class="form-control" min="0" step="0.01" required>
                    </div>

                    <div class="col-md-2">
                        <label for="numeroCuotas" class="form-label">Cuotas</label>
                        <input type="number" id="numeroCuotas" class="form-control" min="1" step="1" required>
                    </div>

                    <div class="col-md-4">
                        <label for="fechaPrestamo" class="form-label">Fecha del préstamo</label>
                        <input type="date" id="fechaPrestamo" class="form-control" required>
                    </div>

                    <div class="col-md-8 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary">Guardar préstamo</button>
                        <button type="button" id="btnCancelarEdicion" class="btn btn-secondary d-none">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Préstamos registrados</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Asociado</th>
                                <th>Valor</th>
                                <th>Tasa</th>
                                <th>Cuotas</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaPrestamos">
                            <tr>
                                <td colspan="7" class="text-center py-3">Cargando préstamos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../Controladores/prestamos.js"></script>
</body>

</html>
